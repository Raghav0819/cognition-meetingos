services:
  - type: web
    name: cognition-meetingos-backend
    runtime: python
    pythonVersion: "3.12"
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:///./meetingos.db
      - key: APP_NAME
        value: Cognition MeetingOS
      - key: CREWAI_LLM_PROVIDER
        value: groq
    plan: free
